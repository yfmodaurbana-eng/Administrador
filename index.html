<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Strangis · Administrador</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    min-height:100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #101010,
            #242424 45%,
            #151515
        );
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

header{

    position:sticky;
    top:0;
    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:20px;

    padding:18px 5%;

    border-bottom:
        1px solid
        rgba(255,255,255,.1);

    background:
        rgba(15,15,15,.94);

    backdrop-filter:blur(15px);
}

.logo{

    font-size:20px;
    font-weight:900;
    letter-spacing:3px;
}

.header-right{

    display:flex;
    align-items:center;
    gap:10px;
}

.status{

    padding:8px 12px;

    border-radius:8px;

    color:#aaa;

    font-size:10px;

    background:
        rgba(255,255,255,.06);
}

.container{

    width:min(1450px,94%);

    margin:auto;

    padding:
        30px
        0
        80px;
}

.top{

    display:flex;
    align-items:flex-end;
    justify-content:space-between;

    gap:20px;

    margin-bottom:25px;
}

.title h1{

    font-size:30px;

    letter-spacing:-1px;
}

.title p{

    margin-top:7px;

    color:#777;

    font-size:12px;
}

.primary{

    padding:13px 18px;

    border:0;
    border-radius:9px;

    color:#111;

    font-weight:900;

    background:#fff;
}

.primary:hover{
    background:#ddd;
}

.search{

    margin-bottom:25px;
}

.search input{

    width:100%;

    height:52px;

    padding:0 18px;

    border:
        1px solid
        rgba(255,255,255,.12);

    border-radius:10px;

    outline:none;

    color:#fff;

    background:
        rgba(255,255,255,.05);
}

.search input:focus{

    border-color:
        rgba(255,255,255,.35);
}

.grid{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(260px,1fr)
        );

    gap:15px;
}

.card{

    overflow:hidden;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:11px;

    background:
        rgba(255,255,255,.045);
}

.card-image{

    position:relative;

    aspect-ratio:1/1;

    background:#111;
}

.card-image img{

    width:100%;
    height:100%;

    display:block;

    object-fit:cover;
}

.card-body{
    padding:15px;
}

.card-name{

    font-size:15px;
    font-weight:900;
}

.card-ref{

    margin-top:6px;

    color:#aaa;

    font-size:10px;
}

.card-colors{

    display:flex;
    flex-wrap:wrap;

    gap:5px;

    margin-top:10px;
}

.color-tag{

    padding:5px 7px;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:5px;

    color:#aaa;

    font-size:9px;
}

.card-actions{

    display:flex;

    gap:7px;

    margin-top:15px;
}

.btn{

    flex:1;

    padding:10px;

    border:0;

    border-radius:7px;

    color:#fff;

    font-size:10px;
    font-weight:800;

    background:
        rgba(255,255,255,.08);
}

.btn:hover{
    background:rgba(255,255,255,.14);
}

.btn.delete{
    color:#ff9b9b;
}

.empty{

    padding:70px 20px;

    text-align:center;

    color:#666;
}

.modal{

    position:fixed;

    inset:0;

    z-index:5000;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        rgba(0,0,0,.75);

    backdrop-filter:blur(8px);
}

.modal.open{
    display:flex;
}

.modal-box{

    width:min(950px,100%);

    max-height:92vh;

    overflow:auto;

    padding:25px;

    border:
        1px solid
        rgba(255,255,255,.12);

    border-radius:14px;

    background:#181818;

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.6);
}

.modal-head{

    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:20px;

    margin-bottom:25px;
}

.modal-head h2{

    font-size:19px;
}

.close{

    width:35px;
    height:35px;

    border:0;
    border-radius:50%;

    color:#aaa;

    background:
        rgba(255,255,255,.08);
}

.form-grid{

    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:14px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.field.full{
    grid-column:1/-1;
}

.field label{

    color:#999;

    font-size:10px;

    font-weight:bold;

    letter-spacing:1px;

    text-transform:uppercase;
}

.field input,
.field select,
.field textarea{

    width:100%;

    padding:12px;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:8px;

    outline:none;

    color:#fff;

    background:
        rgba(255,255,255,.055);
}

.field textarea{

    min-height:90px;

    resize:vertical;
}

.field input:focus,
.field select:focus,
.field textarea:focus{

    border-color:
        rgba(255,255,255,.35);
}

.colors-title{

    display:flex;
    align-items:center;
    justify-content:space-between;

    margin:
        25px
        0
        12px;
}

.colors-title h3{
    font-size:14px;
}

.add-color{

    padding:8px 12px;

    border:0;
    border-radius:7px;

    color:#111;

    font-size:10px;
    font-weight:900;

    background:#fff;
}

.color-box{

    margin-bottom:15px;

    padding:15px;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:10px;

    background:
        rgba(255,255,255,.025);
}

.color-head{

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;

    margin-bottom:12px;
}

.color-number{

    color:#fff;

    font-size:12px;
    font-weight:900;
}

.remove-color{

    border:0;

    color:#ff8989;

    background:none;

    font-size:10px;
}

.images{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(120px,1fr)
        );

    gap:8px;

    margin-top:12px;
}

.image-item{

    position:relative;

    overflow:hidden;

    aspect-ratio:1;

    border-radius:7px;

    background:#111;
}

.image-item img{

    width:100%;
    height:100%;

    object-fit:cover;
}

.image-remove{

    position:absolute;

    top:5px;
    right:5px;

    width:25px;
    height:25px;

    border:0;
    border-radius:50%;

    color:#fff;

    background:
        rgba(0,0,0,.7);
}

.image-url{

    display:flex;

    gap:7px;

    margin-top:10px;
}

.image-url input{
    flex:1;
}

.image-url button{

    padding:0 12px;

    border:0;
    border-radius:7px;

    color:#111;

    font-weight:bold;

    background:#fff;
}

.modal-actions{

    display:flex;

    justify-content:flex-end;

    gap:10px;

    margin-top:25px;

    padding-top:20px;

    border-top:
        1px solid
        rgba(255,255,255,.08);
}

.cancel{

    padding:12px 18px;

    border:0;
    border-radius:8px;

    color:#aaa;

    background:
        rgba(255,255,255,.07);
}

.save{

    padding:12px 22px;

    border:0;
    border-radius:8px;

    color:#111;

    font-weight:900;

    background:#fff;
}

.toast{

    position:fixed;

    right:20px;
    bottom:20px;

    z-index:10000;

    max-width:350px;

    padding:14px 17px;

    border:
        1px solid
        rgba(255,255,255,.12);

    border-radius:9px;

    color:#fff;

    background:#222;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.4);

    opacity:0;

    transform:translateY(15px);

    pointer-events:none;

    transition:.25s ease;
}

.toast.show{

    opacity:1;

    transform:translateY(0);
}

@media(max-width:700px){

    .top{
        align-items:stretch;
        flex-direction:column;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

    .modal-box{
        padding:17px;
    }

    .container{
        width:94%;
    }
}

</style>

</head>

<body>

<header>

    <div class="logo">
        STRANGIS · ADMIN
    </div>

    <div class="header-right">

        <div
            id="connectionStatus"
            class="status"
        >
            Conectando...
        </div>

    </div>

</header>


<main class="container">

    <div class="top">

        <div class="title">

            <h1>
                Productos
            </h1>

            <p>
                Gestiona productos, referencias, colores e imágenes.
            </p>

        </div>

        <button
            class="primary"
            id="newProduct"
        >
            + Nuevo producto
        </button>

    </div>


    <div class="search">

        <input
            id="adminSearch"
            type="search"
            autocomplete="off"
            placeholder="Buscar por referencia, color, nombre, categoría..."
        >

    </div>


    <section
        id="productsGrid"
        class="grid"
    ></section>

</main>


<!-- =====================================================
     MODAL
====================================================== -->

<div
    id="modal"
    class="modal"
>

    <div class="modal-box">

        <div class="modal-head">

            <h2 id="modalTitle">
                Nuevo producto
            </h2>

            <button
                class="close"
                id="closeModal"
            >
                ×
            </button>

        </div>


        <form id="productForm">

            <input
                type="hidden"
                id="productId"
            >


            <div class="form-grid">

                <div class="field">

                    <label>
                        Nombre
                    </label>

                    <input
                        id="productName"
                        required
                    >

                </div>


                <div class="field">

                    <label>
                        Categoría
                    </label>

                    <select id="productCategory">

                        <option value="camisetas">
                            Camisetas
                        </option>

                        <option value="pantalones">
                            Pantalones
                        </option>

                        <option value="conjuntos">
                            Conjuntos
                        </option>

                        <option value="gorras">
                            Gorras
                        </option>

                        <option value="gafas">
                            Gafas
                        </option>

                        <option value="bisuteria">
                            Bisutería
                        </option>

                    </select>

                </div>


                <div class="field full">

                    <label>
                        Descripción
                    </label>

                    <textarea
                        id="productDescription"
                    ></textarea>

                </div>


                <div class="field">

                    <label>
                        Precio
                    </label>

                    <input
                        id="productPrice"
                        type="number"
                        step="0.01"
                    >

                </div>


                <div class="field">

                    <label>
                        Producto activo
                    </label>

                    <select id="productActive">

                        <option value="true">
                            Sí
                        </option>

                        <option value="false">
                            No
                        </option>

                    </select>

                </div>

            </div>


            <div class="colors-title">

                <h3>
                    Colores y referencias
                </h3>

                <button
                    type="button"
                    class="add-color"
                    id="addColor"
                >
                    + Añadir color
                </button>

            </div>


            <div id="colorsContainer"></div>


            <div class="modal-actions">

                <button
                    type="button"
                    class="cancel"
                    id="cancelModal"
                >
                    Cancelar
                </button>

                <button
                    type="submit"
                    class="save"
                >
                    Guardar producto
                </button>

            </div>

        </form>

    </div>

</div>


<div
    id="toast"
    class="toast"
></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =====================================================
   SUPABASE
====================================================== */

const SUPABASE_URL =
    "https://xbbjfatmdbxbuoqdrgoj.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_M7ETdIWvj4nCQZ55i24Vpw_5Yc5Islk";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =====================================================
   ESTADO
====================================================== */

let products = [];

let editingProduct = null;


/* =====================================================
   HELPERS
====================================================== */

function normalize(value){

    return String(value ?? "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .toLowerCase()
        .trim();
}


function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function toast(message){

    const element =
        document.getElementById("toast");

    element.textContent =
        message;

    element.classList.add("show");

    setTimeout(
        ()=>{
            element.classList.remove("show");
        },
        2500
    );
}


/* =====================================================
   VARIANTES
====================================================== */

function parseVariants(value){

    if(!value){
        return [];
    }

    if(Array.isArray(value)){
        return value;
    }

    if(typeof value === "string"){

        try{

            const parsed =
                JSON.parse(value);

            return Array.isArray(parsed)
                ? parsed
                : [];

        }

        catch(error){

            return [];
        }
    }

    return [];
}


/* =====================================================
   BUSCADOR
====================================================== */

function getSearchText(product){

    const variants =
        parseVariants(product.variants);

    const variantText =
        variants
            .map(variant => {

                return [
                    variant.color,
                    variant.ref,
                    ...(variant.images || [])
                ].join(" ");

            })
            .join(" ");

    return normalize([
        product.name,
        product.ref,
        product.reference,
        product.sku,
        product.category,
        variantText
    ].join(" "));
}


/* =====================================================
   FILTRAR
====================================================== */

function getFilteredProducts(){

    const query =
        normalize(
            document.getElementById(
                "adminSearch"
            ).value
        );

    if(!query){
        return products;
    }

    return products.filter(
        product =>
            getSearchText(product)
                .includes(query)
    );
}


/* =====================================================
   RENDER
====================================================== */

function renderProducts(){

    const container =
        document.getElementById(
            "productsGrid"
        );

    const filtered =
        getFilteredProducts();


    if(!filtered.length){

        container.innerHTML = `

            <div class="empty">

                No se encontraron productos.

            </div>

        `;

        return;
    }


    container.innerHTML =
        filtered
            .map(createCard)
            .join("");
}


function createCard(product){

    const variants =
        parseVariants(
            product.variants
        );

    const firstImage =
        variants[0]?.images?.[0]
        || product.images?.[0]
        || "";


    const colors =
        variants
            .map(
                variant =>
                    `
                    <span class="color-tag">
                        ${escapeHTML(
                            variant.color || "Sin color"
                        )}
                        ${
                            variant.ref
                            ? " · " +
                              escapeHTML(variant.ref)
                            : ""
                        }
                    </span>
                    `
            )
            .join("");


    return `

        <article class="card">

            <div class="card-image">

                ${
                    firstImage

                    ?

                    `
                    <img
                        src="${escapeHTML(firstImage)}"
                        alt="${escapeHTML(product.name)}"
                    >
                    `

                    :

                    ""
                }

            </div>


            <div class="card-body">

                <div class="card-name">
                    ${escapeHTML(
                        product.name
                    )}
                </div>


                <div class="card-ref">

                    REF GENERAL:
                    ${
                        escapeHTML(
                            product.ref ||
                            product.reference ||
                            product.sku ||
                            "—"
                        )
                    }

                </div>


                <div class="card-ref">

                    ${escapeHTML(
                        product.category ||
                        "Sin categoría"
                    )}

                </div>


                <div class="card-colors">

                    ${
                        colors ||
                        `<span class="color-tag">
                            Sin colores
                        </span>`
                    }

                </div>


                <div class="card-actions">

                    <button
                        class="btn"
                        onclick="editProduct('${product.id}')"
                    >
                        Editar
                    </button>

                    <button
                        class="btn delete"
                        onclick="deleteProduct('${product.id}')"
                    >
                        Eliminar
                    </button>

                </div>

            </div>

        </article>

    `;
}


/* =====================================================
   COLORES
====================================================== */

function addColor(variant = {}){

    const container =
        document.getElementById(
            "colorsContainer"
        );

    const index =
        container.children.length;


    const box =
        document.createElement("div");

    box.className =
        "color-box";


    box.innerHTML = `

        <div class="color-head">

            <div class="color-number">
                Color ${index + 1}
            </div>

            <button
                type="button"
                class="remove-color"
            >
                Eliminar color
            </button>

        </div>


        <div class="form-grid">

            <div class="field">

                <label>
                    Nombre del color
                </label>

                <input
                    class="variant-color"
                    value="${escapeHTML(
                        variant.color || ""
                    )}"
                    placeholder="Ej: Negro"
                >

            </div>


            <div class="field">

                <label>
                    Referencia automática
                </label>

                <input
                    class="variant-ref"
                    value="${escapeHTML(
                        variant.ref || ""
                    )}"
                    placeholder="Ej: STR-NEG-001"
                >

            </div>

        </div>


        <div class="image-url">

            <input
                class="new-image-url"
                placeholder="Pega aquí la URL de una imagen"
            >

            <button
                type="button"
                class="add-image"
            >
                Añadir
            </button>

        </div>


        <div class="images"></div>

    `;


    container.appendChild(box);


    const images =
        Array.isArray(variant.images)
        ? variant.images
        : [];


    images.forEach(
        image =>
            addImageToColor(
                box,
                image
            )
    );


    box.querySelector(
        ".remove-color"
    ).addEventListener(
        "click",
        ()=>{
            box.remove();
            refreshColorNumbers();
        }
    );


    box.querySelector(
        ".add-image"
    ).addEventListener(
        "click",
        ()=>{

            const input =
                box.querySelector(
                    ".new-image-url"
                );

            const url =
                input.value.trim();

            if(!url){
                return;
            }

            addImageToColor(
                box,
                url
            );

            input.value = "";

        }
    );
}


function addImageToColor(box,url){

    const container =
        box.querySelector(
            ".images"
        );

    const item =
        document.createElement("div");

    item.className =
        "image-item";


    item.innerHTML = `

        <img
            src="${escapeHTML(url)}"
            alt=""
        >

        <button
            type="button"
            class="image-remove"
        >
            ×
        </button>

    `;


    item.querySelector(
        ".image-remove"
    ).addEventListener(
        "click",
        ()=>{
            item.remove();
        }
    );


    container.appendChild(item);
}


function refreshColorNumbers(){

    document
        .querySelectorAll(
            ".color-box"
        )
        .forEach(
            (box,index)=>{

                box.querySelector(
                    ".color-number"
                ).textContent =
                    `Color ${index + 1}`;

            }
        );
}


/* =====================================================
   RECOPILAR COLORES
====================================================== */

function collectVariants(){

    const result = [];


    document
        .querySelectorAll(
            ".color-box"
        )
        .forEach(box=>{

            const color =
                box.querySelector(
                    ".variant-color"
                ).value.trim();


            const ref =
                box.querySelector(
                    ".variant-ref"
                ).value.trim();


            const images =
                [
                    ...box.querySelectorAll(
                        ".image-item img"
                    )
                ]
                .map(
                    img =>
                        img.src
                );


            if(
                color ||
                ref ||
                images.length
            ){

                result.push({

                    color,

                    ref,

                    images

                });

            }

        });


    return result;
}


/* =====================================================
   ABRIR MODAL
====================================================== */

function openModal(product = null){

    editingProduct =
        product;


    const modal =
        document.getElementById(
            "modal"
        );


    document.getElementById(
        "modalTitle"
    ).textContent =
        product
        ? "Editar producto"
        : "Nuevo producto";


    document.getElementById(
        "productId"
    ).value =
        product?.id || "";


    document.getElementById(
        "productName"
    ).value =
        product?.name || "";


    document.getElementById(
        "productCategory"
    ).value =
        product?.category || "camisetas";


    document.getElementById(
        "productDescription"
    ).value =
        product?.description || "";


    document.getElementById(
        "productPrice"
    ).value =
        product?.price ?? "";


    document.getElementById(
        "productActive"
    ).value =
        product?.active === false
        ? "false"
        : "true";


    const colors =
        document.getElementById(
            "colorsContainer"
        );

    colors.innerHTML = "";


    const variants =
        parseVariants(
            product?.variants
        );


    if(variants.length){

        variants.forEach(
            variant =>
                addColor(variant)
        );

    }

    else{

        addColor();

    }


    modal.classList.add("open");
}


/* =====================================================
   CERRAR
====================================================== */

function closeModal(){

    document
        .getElementById("modal")
        .classList.remove("open");

    editingProduct =
        null;
}


/* =====================================================
   EDITAR
====================================================== */

window.editProduct =
    function(id){

        const product =
            products.find(
                item =>
                    String(item.id) ===
                    String(id)
            );

        if(product){
            openModal(product);
        }
    };


/* =====================================================
   ELIMINAR
====================================================== */

window.deleteProduct =
    async function(id){

        const product =
            products.find(
                item =>
                    String(item.id) ===
                    String(id)
            );


        if(!product){
            return;
        }


        const confirmed =
            confirm(
                `¿Eliminar "${product.name}"?`
            );


        if(!confirmed){
            return;
        }


        const {error} =
            await supabaseClient
                .from("Products")
                .delete()
                .eq("id",id);


        if(error){

            console.error(error);

            toast(
                "No se pudo eliminar."
            );

            return;
        }


        toast(
            "Producto eliminado."
        );


        await loadProducts();
    };


/* =====================================================
   GUARDAR
====================================================== */

async function saveProduct(event){

    event.preventDefault();


    const id =
        document.getElementById(
            "productId"
        ).value;


    const name =
        document.getElementById(
            "productName"
        ).value.trim();


    const category =
        document.getElementById(
            "productCategory"
        ).value;


    const description =
        document.getElementById(
            "productDescription"
        ).value.trim();


    const priceValue =
        document.getElementById(
            "productPrice"
        ).value;


    const active =
        document.getElementById(
            "productActive"
        ).value === "true";


    const variants =
        collectVariants();


    /*
     * La primera referencia de color
     * se utiliza también como referencia
     * principal si no existe otra.
     */

    const firstReference =
        variants[0]?.ref || "";


    const payload = {

        name,

        category,

        description,

        price:
            priceValue === ""
            ? null
            : Number(priceValue),

        active,

        variants,

        /*
         * Compatibilidad con tu Inicio actual.
         */
        ref:
            firstReference || null,

        /*
         * Imagen principal.
         */
        images:
            variants
                .flatMap(
                    variant =>
                        variant.images || []
                )

    };


    try{

        let response;


        if(id){

            response =
                await supabaseClient
                    .from("Products")
                    .update(payload)
                    .eq("id",id);

        }

        else{

            response =
                await supabaseClient
                    .from("Products")
                    .insert(
                        payload
                    );

        }


        if(response.error){
            throw response.error;
        }


        toast(
            id
            ? "Producto actualizado."
            : "Producto creado."
        );


        closeModal();

        await loadProducts();

    }

    catch(error){

        console.error(
            "Error guardando producto:",
            error
        );


        toast(
            error?.message ||
            "Error guardando producto."
        );
    }
}


/* =====================================================
   CARGAR
====================================================== */

async function loadProducts(){

    const status =
        document.getElementById(
            "connectionStatus"
        );


    try{

        const {data,error} =
            await supabaseClient

                .from("Products")

                .select("*")

                .order(
                    "id",
                    {
                        ascending:false
                    }
                );


        if(error){
            throw error;
        }


        products =
            Array.isArray(data)
            ? data
            : [];


        status.textContent =
            `Conectado · ${products.length} productos`;


        status.style.color =
            "#8cffad";


        renderProducts();

    }

    catch(error){

        console.error(error);


        status.textContent =
            "Error de conexión";


        status.style.color =
            "#ff8989";


        document.getElementById(
            "productsGrid"
        ).innerHTML = `

            <div class="empty">

                <strong>
                    No se pudieron cargar los productos.
                </strong>

                <br><br>

                ${escapeHTML(
                    error?.message ||
                    "Error desconocido"
                )}

            </div>

        `;
    }
}


/* =====================================================
   EVENTOS
====================================================== */

document
    .getElementById("newProduct")
    .addEventListener(
        "click",
        ()=>{
            openModal();
        }
    );


document
    .getElementById("closeModal")
    .addEventListener(
        "click",
        closeModal
    );


document
    .getElementById("cancelModal")
    .addEventListener(
        "click",
        closeModal
    );


document
    .getElementById("addColor")
    .addEventListener(
        "click",
        ()=>{
            addColor();
        }
    );


document
    .getElementById("productForm")
    .addEventListener(
        "submit",
        saveProduct
    );


document
    .getElementById("adminSearch")
    .addEventListener(
        "input",
        renderProducts
    );


document
    .getElementById("modal")
    .addEventListener(
        "click",
        event=>{

            if(
                event.target.id ===
                "modal"
            ){
                closeModal();
            }

        }
    );


/* =====================================================
   INICIO
====================================================== */

loadProducts();

</script>
