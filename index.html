<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prueba Strangis</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    padding:40px 20px;
    background:#181818;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

/* =========================
   TARJETA
========================= */

.product{
    width:min(380px,100%);
    margin:auto;

    padding:12px;

    border:1px solid rgba(255,255,255,.12);
    border-radius:10px;

    background:rgba(255,255,255,.05);
}

/* =========================
   FOTO
========================= */

.product-gallery{
    position:relative;

    width:100%;
    height:360px;

    overflow:hidden;

    border-radius:7px;

    background:#111;

    touch-action:pan-y;
}

.product-image{
    width:100%;
    height:100%;
}

.product-image img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    user-select:none;
    -webkit-user-drag:none;
}

/* =========================
   TEXTO DENTRO DE LA FOTO
========================= */

.image-info{
    position:absolute;

    left:12px;
    bottom:12px;

    z-index:3;

    display:flex;
    flex-direction:column;

    gap:5px;

    pointer-events:none;
}

.image-label{
    width:max-content;

    padding:7px 10px;

    border-radius:5px;

    background:rgba(0,0,0,.72);

    backdrop-filter:blur(6px);

    color:#fff;

    font-size:10px;
    font-weight:900;

    letter-spacing:1px;

    text-transform:uppercase;
}

.image-ref{
    width:max-content;

    padding:5px 8px;

    border-radius:4px;

    background:rgba(0,0,0,.58);

    color:#ddd;

    font-size:8px;
    font-weight:bold;

    letter-spacing:1px;
}

/* =========================
   FLECHAS
========================= */

.gallery-arrow{
    position:absolute;

    top:50%;
    z-index:5;

    width:38px;
    height:38px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid rgba(255,255,255,.3);

    border-radius:50%;

    background:rgba(0,0,0,.55);

    color:#fff;

    cursor:pointer;

    font-size:22px;

    transform:translateY(-50%);
}

.gallery-arrow.prev{
    left:10px;
}

.gallery-arrow.next{
    right:10px;
}

/* =========================
   CONTADOR
========================= */

.gallery-counter{
    position:absolute;

    left:50%;
    bottom:10px;

    z-index:4;

    padding:5px 9px;

    border-radius:20px;

    background:rgba(0,0,0,.55);

    color:#fff;

    font-size:9px;
    font-weight:bold;

    transform:translateX(-50%);

    pointer-events:none;
}

/* =========================
   INFORMACIÓN
========================= */

.product-info{
    padding:14px 2px 3px;
}

.product-name{
    font-size:16px;
    font-weight:800;
}

.product-price{
    margin-top:7px;

    font-size:16px;
    font-weight:800;
}

.product-description{
    margin-top:7px;

    color:#999;

    font-size:11px;
    line-height:1.4;
}

/* =========================
   MÓVIL
========================= */

@media(max-width:600px){

    body{
        padding:25px 12px;
    }

    .product-gallery{
        height:330px;
    }

    .gallery-arrow{
        width:36px;
        height:36px;
    }
}
</style>
</head>

<body>


<article class="product">

    <div
        class="product-gallery"
        id="gallery"
    >

        <div
            class="product-image"
            id="imageContainer"
        >

            <img
                id="productImage"
                src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=900&q=80"
                alt="Producto"
                draggable="false"
            >

        </div>


        <!-- TEXTO SOBRE LA IMAGEN -->

        <div class="image-info">

            <div
                class="image-label"
                id="colorLabel"
            >
                VERDE
            </div>

            <div
                class="image-ref"
                id="refLabel"
            >
                REF: PANT-001
            </div>

        </div>


        <!-- FLECHA IZQUIERDA -->

        <button
            class="gallery-arrow prev"
            type="button"
            onclick="changeImage(-1)"
        >
            ‹
        </button>


        <!-- FLECHA DERECHA -->

        <button
            class="gallery-arrow next"
            type="button"
            onclick="changeImage(1)"
        >
            ›
        </button>


        <!-- CONTADOR -->

        <div
            class="gallery-counter"
            id="counter"
        >
            1 / 3
        </div>

    </div>


    <div class="product-info">

        <div class="product-name">
            Pantalón Strangis
        </div>

        <div class="product-price">
            39,99 €
        </div>

        <div class="product-description">
            Pantalón urbano de corte moderno.
        </div>

    </div>

</article>


<script>

/* =========================
   DATOS DE PRUEBA
========================= */

const images = [

    {
        image:
            "https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=900&q=80",

        color:
            "Verde",

        ref:
            "PANT-001"
    },

    {
        image:
            "https://images.unsplash.com/photo-1542272604-787c3835535d?auto=format&fit=crop&w=900&q=80",

        color:
            "Negro",

        ref:
            "PANT-001"
    },

    {
        image:
            "https://images.unsplash.com/photo-1506629905607-d9c297d8cbb8?auto=format&fit=crop&w=900&q=80",

        color:
            "Rojo",

        ref:
            "PANT-001"
    }

];


let currentImage = 0;


/* =========================
   CAMBIAR IMAGEN
========================= */

function updateImage(){

    const item =
        images[currentImage];


    document.getElementById(
        "productImage"
    ).src =
        item.image;


    document.getElementById(
        "colorLabel"
    ).textContent =
        item.color;


    document.getElementById(
        "refLabel"
    ).textContent =
        "REF: " + item.ref;


    document.getElementById(
        "counter"
    ).textContent =
        `${currentImage + 1} / ${images.length}`;

}


/* =========================
   FLECHAS
========================= */

function changeImage(direction){

    currentImage += direction;


    if(
        currentImage >= images.length
    ){

        currentImage = 0;

    }


    if(currentImage < 0){

        currentImage =
            images.length - 1;

    }


    updateImage();

}


/* =========================
   DESLIZAR EN MÓVIL
========================= */

let startX = 0;
let startY = 0;


const gallery =
    document.getElementById(
        "gallery"
    );


gallery.addEventListener(
    "touchstart",
    function(event){

        if(
            !event.touches ||
            !event.touches.length
        ){
            return;
        }


        startX =
            event.touches[0].clientX;

        startY =
            event.touches[0].clientY;

    },
    {passive:true}
);


gallery.addEventListener(
    "touchend",
    function(event){

        if(
            !event.changedTouches ||
            !event.changedTouches.length
        ){
            return;
        }


        const endX =
            event.changedTouches[0].clientX;

        const endY =
            event.changedTouches[0].clientY;


        const differenceX =
            endX - startX;

        const differenceY =
            endY - startY;


        /*
         * Si el movimiento es principalmente
         * vertical, no cambiamos la foto.
         */

        if(
            Math.abs(differenceX) < 45 ||
            Math.abs(differenceX) <
            Math.abs(differenceY)
        ){
            return;
        }


        if(differenceX < 0){

            changeImage(1);

        }else{

            changeImage(-1);

        }

    },
    {passive:true}
);

</script>

</body>
</html>
