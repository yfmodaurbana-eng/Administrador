<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prueba Strangis - Variantes</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    padding:30px 15px 60px;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    background:
        linear-gradient(
            135deg,
            #151515,
            #292929 45%,
            #111
        );
}

.container{
    width:min(1100px,100%);
    margin:auto;
}

h1{
    margin-bottom:8px;
    font-size:32px;
}

.subtitle{
    margin-bottom:30px;
    color:#999;
    font-size:13px;
}

/* =========================
   PANEL SIMULADO
========================= */

.panel{
    padding:20px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:12px;
    background:rgba(255,255,255,.05);
}

.panel-title{
    margin-bottom:18px;
    font-size:14px;
    font-weight:900;
    letter-spacing:1px;
}

.variant-editor{
    display:grid;
    grid-template-columns:100px 1fr 180px;
    align-items:center;
    gap:15px;

    margin-bottom:12px;
    padding:12px;

    border:1px solid rgba(255,255,255,.10);
    border-radius:8px;

    background:rgba(0,0,0,.25);
}

.variant-preview{
    width:100px;
    height:80px;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    border-radius:6px;
    background:#222;

    color:#666;
    font-size:9px;
}

.variant-preview img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.variant-name{
    font-size:13px;
    font-weight:bold;
}

.variant-file{
    margin-top:5px;
    color:#777;
    font-size:10px;
}

.color-select{
    width:100%;
    padding:11px;

    border:1px solid rgba(255,255,255,.18);
    border-radius:6px;

    background:#181818;
    color:#fff;

    outline:none;
}

.save-button{
    width:100%;
    margin-top:8px;
    padding:14px;

    border:0;
    border-radius:6px;

    background:#fff;
    color:#111;

    cursor:pointer;

    font-weight:900;
    letter-spacing:1px;
}

/* =========================
   PREVIEW TIENDA
========================= */

.preview-title{
    margin:45px 0 15px;

    font-size:14px;
    font-weight:900;
    letter-spacing:1px;
}

.shop{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:18px;
}

.product{
    overflow:hidden;

    padding:13px;

    border:1px solid rgba(255,255,255,.12);
    border-radius:10px;

    background:rgba(255,255,255,.055);
}

/* =========================
   IMAGEN
========================= */

.gallery{
    position:relative;

    height:330px;

    margin:-13px -13px 14px;

    overflow:hidden;

    background:#171717;

    touch-action:pan-y;
}

.gallery img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    user-select:none;
    pointer-events:none;
}

/* =========================
   FLECHAS
========================= */

.arrow{
    position:absolute;
    top:50%;
    z-index:5;

    width:38px;
    height:38px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid rgba(255,255,255,.25);
    border-radius:50%;

    background:rgba(0,0,0,.58);

    color:#fff;

    cursor:pointer;

    font-size:22px;

    transform:translateY(-50%);
}

.arrow.prev{
    left:10px;
}

.arrow.next{
    right:10px;
}

/* =========================
   INFO SOBRE FOTO
========================= */

.variant-info{
    position:absolute;

    left:10px;
    bottom:10px;
    z-index:5;

    padding:7px 10px;

    border:1px solid rgba(255,255,255,.16);
    border-radius:5px;

    background:rgba(0,0,0,.68);

    color:#fff;

    font-size:9px;
    font-weight:900;

    letter-spacing:.7px;

    backdrop-filter:blur(8px);
}

.counter{
    position:absolute;

    right:10px;
    bottom:10px;
    z-index:5;

    padding:5px 8px;

    border-radius:15px;

    background:rgba(0,0,0,.60);

    color:#fff;

    font-size:9px;
}

/* =========================
   PRODUCT INFO
========================= */

.product-name{
    font-size:15px;
    font-weight:800;
}

.product-description{
    margin-top:7px;

    color:#999;

    font-size:11px;
    line-height:1.4;
}

.price{
    margin-top:12px;

    font-size:17px;
    font-weight:900;
}

.buy{
    width:100%;

    margin-top:14px;
    padding:13px;

    border:0;
    border-radius:5px;

    background:#fff;
    color:#111;

    cursor:pointer;

    font-size:10px;
    font-weight:900;
    letter-spacing:1px;
}

/* =========================
   MENSAJE
========================= */

.message{
    position:fixed;
    left:50%;
    bottom:20px;

    z-index:100;

    padding:12px 18px;

    border:1px solid rgba(255,255,255,.15);
    border-radius:8px;

    background:#181818;

    color:#fff;

    font-size:11px;

    transform:
        translateX(-50%)
        translateY(100px);

    opacity:0;

    transition:.25s;
}

.message.show{
    transform:
        translateX(-50%)
        translateY(0);

    opacity:1;
}

/* =========================
   MÓVIL
========================= */

@media(max-width:750px){

    .variant-editor{
        grid-template-columns:80px 1fr;
    }

    .variant-preview{
        width:80px;
        height:65px;
    }

    .color-select{
        grid-column:1/-1;
    }

    .shop{
        grid-template-columns:1fr;
    }

    .gallery{
        height:360px;
    }
}

@media(max-width:400px){

    .gallery{
        height:330px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>Prueba de variantes</h1>

    <div class="subtitle">
        Panel de control → color asociado a cada imagen → tarjeta automática
    </div>


    <!-- =========================
         PANEL SIMULADO
    ========================== -->

    <div class="panel">

        <div class="panel-title">
            PANEL DE CONTROL · VARIANTES
        </div>


        <div class="variant-editor">

            <div class="variant-preview">

                <img
                    id="panelImage0"
                    src="https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?auto=format&fit=crop&w=500&q=80"
                    alt=""
                >

            </div>

            <div>

                <div class="variant-name">
                    Imagen 1
                </div>

                <div class="variant-file">
                    pantalon-verde.jpg
                </div>

            </div>

            <select
                class="color-select"
                id="color0"
                onchange="updateColor(0)"
            >

                <option value="Verde">
                    Verde
                </option>

                <option value="Negro">
                    Negro
                </option>

                <option value="Beige">
                    Beige
                </option>

                <option value="Azul">
                    Azul
                </option>

            </select>

        </div>


        <div class="variant-editor">

            <div class="variant-preview">

                <img
                    id="panelImage1"
                    src="https://images.unsplash.com/photo-1552902865-b72c031ac5ea?auto=format&fit=crop&w=500&q=80"
                    alt=""
                >

            </div>

            <div>

                <div class="variant-name">
                    Imagen 2
                </div>

                <div class="variant-file">
                    pantalon-negro.jpg
                </div>

            </div>

            <select
                class="color-select"
                id="color1"
                onchange="updateColor(1)"
            >

                <option value="Negro">
                    Negro
                </option>

                <option value="Verde">
                    Verde
                </option>

                <option value="Beige">
                    Beige
                </option>

                <option value="Azul">
                    Azul
                </option>

            </select>

        </div>


        <div class="variant-editor">

            <div class="variant-preview">

                <img
                    id="panelImage2"
                    src="https://images.unsplash.com/photo-1542272604-787c3835535d?auto=format&fit=crop&w=500&q=80"
                    alt=""
                >

            </div>

            <div>

                <div class="variant-name">
                    Imagen 3
                </div>

                <div class="variant-file">
                    pantalon-beige.jpg
                </div>

            </div>

            <select
                class="color-select"
                id="color2"
                onchange="updateColor(2)"
            >

                <option value="Beige">
                    Beige
                </option>

                <option value="Verde">
                    Verde
                </option>

                <option value="Negro">
                    Negro
                </option>

                <option value="Azul">
                    Azul
                </option>

            </select>

        </div>


        <button
            class="save-button"
            onclick="saveVariants()"
        >
            GUARDAR CONFIGURACIÓN
        </button>

    </div>


    <!-- =========================
         PREVIEW
    ========================== -->

    <div class="preview-title">
        VISTA PREVIA · TIENDA
    </div>


    <div class="shop">

        <article class="product">

            <div
                class="gallery"
                id="gallery"
            >

                <img
                    id="productImage"
                    src=""
                    alt="Pantalón"
                >


                <button
                    class="arrow prev"
                    onclick="previousVariant()"
                >
                    ‹
                </button>


                <button
                    class="arrow next"
                    onclick="nextVariant()"
                >
                    ›
                </button>


                <div
                    class="variant-info"
                    id="variantInfo"
                >
                </div>


                <div
                    class="counter"
                    id="counter"
                >
                </div>

            </div>


            <div class="product-name">
                Pantalón Cargo
            </div>


            <div class="product-description">
                Pantalón cargo con diseño urbano.
            </div>


            <div class="price">
                39,90 €
            </div>


            <button
                class="buy"
                onclick="buyProduct()"
            >
                COMPRAR
            </button>

        </article>

    </div>

</div>


<div
    class="message"
    id="message"
></div>


<script>

/* =========================
   DATOS DE PRUEBA
========================= */

const variants = [

    {
        image:
            "https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?auto=format&fit=crop&w=900&q=90",

        color:
            "Verde"
    },

    {
        image:
            "https://images.unsplash.com/photo-1552902865-b72c031ac5ea?auto=format&fit=crop&w=900&q=90",

        color:
            "Negro"
    },

    {
        image:
            "https://images.unsplash.com/photo-1542272604-787c3835535d?auto=format&fit=crop&w=900&q=90",

        color:
            "Beige"
    }

];


let currentVariant = 0;


/* =========================
   ACTUALIZAR COLOR
========================= */

function updateColor(index){

    const select =
        document.getElementById(
            `color${index}`
        );


    if(!select)return;


    variants[index].color =
        select.value;


    if(index === currentVariant){

        updateProduct();

    }


    showMessage(
        `Imagen ${index + 1}: color "${select.value}"`
    );

}


/* =========================
   ACTUALIZAR PRODUCTO
========================= */

function updateProduct(){

    const variant =
        variants[currentVariant];


    document.getElementById(
        "productImage"
    ).src =
        variant.image;


    document.getElementById(
        "variantInfo"
    ).textContent =
        `${variant.color} · REF. PT-001`;


    document.getElementById(
        "counter"
    ).textContent =
        `${currentVariant + 1} / ${variants.length}`;

}


/* =========================
   SIGUIENTE
========================= */

function nextVariant(){

    currentVariant++;


    if(
        currentVariant >=
        variants.length
    ){

        currentVariant = 0;

    }


    updateProduct();

}


/* =========================
   ANTERIOR
========================= */

function previousVariant(){

    currentVariant--;


    if(currentVariant < 0){

        currentVariant =
            variants.length - 1;

    }


    updateProduct();

}


/* =========================
   GUARDAR
========================= */

function saveVariants(){

    updateProduct();

    showMessage(
        "Configuración guardada correctamente"
    );

}


/* =========================
   COMPRA
========================= */

function buyProduct(){

    const variant =
        variants[currentVariant];


    showMessage(
        `Pedido: ${variant.color} · REF. PT-001`
    );

}


/* =========================
   MENSAJE
========================= */

let messageTimer;


function showMessage(text){

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.classList.add(
        "show"
    );


    clearTimeout(
        messageTimer
    );


    messageTimer =
        setTimeout(
            ()=>{
                message.classList.remove(
                    "show"
                );
            },
            2200
        );

}


/* =========================
   DESLIZAR EN MÓVIL
========================= */

let startX = 0;
let startY = 0;


const gallery =
    document.getElementById(
        "gallery"
    );


gallery.addEventListener(
    "touchstart",
    function(event){

        if(
            !event.touches ||
            !event.touches.length
        ){
            return;
        }


        startX =
            event.touches[0].clientX;

        startY =
            event.touches[0].clientY;

    },
    {
        passive:true
    }
);


gallery.addEventListener(
    "touchend",
    function(event){

        if(
            !event.changedTouches ||
            !event.changedTouches.length
        ){
            return;
        }


        const endX =
            event.changedTouches[0].clientX;

        const endY =
            event.changedTouches[0].clientY;


        const diffX =
            endX - startX;

        const diffY =
            endY - startY;


        /*
         * Si el movimiento es principalmente
         * horizontal, cambiamos de variante.
         */

        if(
            Math.abs(diffX) < 45 ||
            Math.abs(diffX) <
            Math.abs(diffY)
        ){

            return;

        }


        if(diffX < 0){

            nextVariant();

        }else{

            previousVariant();

        }

    },
    {
        passive:true
    }
);


/* =========================
   INICIO
========================= */

updateProduct();

</script>

</body>
</html>
